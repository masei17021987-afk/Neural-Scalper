[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptohunter-neural-scalper"
version = "0.1.1"
description = "Локальная нейросетевая лаборатория скальпинга по стакану с paper-trading и тёмным русским интерфейсом."
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{name = "CryptoHunter"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "aiohttp>=3.10,<4",
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1"]
build = ["pyinstaller>=6.10,<7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"neuroscalper.web" = ["static/*"]
