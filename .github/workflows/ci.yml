name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / Ubuntu / тесты
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Проверить Bash-сценарии Ubuntu
        run: bash -n INSTALL_UBUNTU.sh start.sh START_UBUNTU.sh STOP.sh STOP_UBUNTU.sh RUN_TESTS.sh CHECK_GPU.sh PUBLISH_TO_GITHUB.sh UNINSTALL_UBUNTU_SHORTCUTS.sh scripts/*.sh

      - name: Проверить синтаксис Python
        run: python -m compileall -q src tests integration

      - name: Запустить тесты
        env:
          NEUROSCALPER_VAR_DIR: ${{ runner.temp }}/neuroscalper-test-var
        run: python -m pytest -q

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Проверить JavaScript
        run: node --check src/neuroscalper/web/static/app.js

      - name: Предпубликационная проверка
        run: python scripts/prepublish_check.py

      - name: Проверить отсутствие runtime-данных в индексе
        run: |
          if git ls-files | grep -E '(^|/)\.env$|^var/(data|logs|models|reports|cache)/.+[^.]gitkeep$|\.venv/'; then
            echo "В репозиторий попали runtime-данные или секреты"
            exit 1
          fi
