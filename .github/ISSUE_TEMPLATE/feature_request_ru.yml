name: Предложить функцию
about: Новая функция или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какая проблема решается
      description: Опишите пользовательскую или исследовательскую потребность, а не только кнопку.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Рыночные данные
        - Признаки
        - Нейросеть/обучение
        - Бэктест/исполнение
        - Риск
        - Интерфейс
        - Интеграция CryptoHunter
        - Документация
        - Другое
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Риски и ограничения
      description: Как изменение может повлиять на безопасность, данные или результаты?
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии готовности
      placeholder: Проверяемые условия, по которым функция считается завершённой.
    validations:
      required: true
