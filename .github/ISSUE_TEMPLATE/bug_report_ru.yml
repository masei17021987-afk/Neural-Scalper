name: Сообщить об ошибке
about: Воспроизводимая проблема программы
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте API-ключи, приватные данные и чувствительную торговую логику.
  - type: input
    id: version
    attributes:
      label: Версия или commit
      placeholder: 0.1.1 / abc1234
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      options:
        - Windows 10
        - Windows 11
        - Linux
        - Другая
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: "1. Запустил...\n2. Нажал...\n3. Получил..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Фрагмент журнала без секретов
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я проверил, что в сообщении нет API-ключей и приватных данных
          required: true
        - label: Я посмотрел TROUBLESHOOTING_RU.md
          required: true
